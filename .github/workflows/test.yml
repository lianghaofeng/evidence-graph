name: test

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          python -m pip install pyyaml
      - name: 单元测试
        working-directory: skills/evidence-graph
        run: python -m unittest -v scripts/test_graph.py
